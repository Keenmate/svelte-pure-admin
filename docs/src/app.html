<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Preload critical font for Audi theme (Fira Sans Condensed - Latin subset) -->
		<link rel="preload" href="/fonts/google/wEOhEADFm8hSaQTFG18FErVhsC9x-tarUfbtrQ.woff2" as="font" type="font/woff2" crossorigin>
		<!-- Font Awesome for icons -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
		<!-- Floating UI for tooltips and popovers -->
		<script src="https://cdn.jsdelivr.net/npm/@floating-ui/core@1.6.0"></script>
		<script src="https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.6.3"></script>
		<!-- Load theme CSS before render (render-blocking <link> prevents FOUC).
		     Reads theme from localStorage (SettingsPanel) → cookie (server) → default.
		     SettingsPanel updates this <link>'s href at runtime when theme changes.
		     The valid theme list is derived from docs/static/themes/*/theme.json at
		     prerender time (see +layout.server.ts). If localStorage holds a stale
		     theme id (uninstalled), the <link> 404s and the SettingsPanel will
		     overwrite it with a valid one on first interaction. -->
		<script>
			(function() {
				var theme = localStorage.getItem('theme');
				if (!theme) {
					var match = document.cookie.match(/(^| )theme=([^;]+)/);
					theme = match ? match[2] : 'audi';
				}
				var link = document.createElement('link');
				link.id = 'pa-theme-css';
				link.rel = 'stylesheet';
				// Installed themes live at themes/<id>/dist/<id>.css (the zip-extracted
				// layout the CLI ships today). This render-blocking bootstrap MUST point
				// at the same file the server resolves (+layout.server.ts resolveCssRelative,
				// which probes dist/ AND the registry's css/ layout) — otherwise the link
				// 404s and the whole admin paints COMPLETELY UNSTYLED until hydration
				// re-assigns the href. Use dist/ (current reality) with a css/ fallback
				// for the registry layout, so either install source works without a flash.
				// The ?v= token is a one-time cache-buster (earlier builds served theme CSS
				// as `immutable`); it MUST match the token appended to cssPath in
				// +layout.server.ts, or the href gets re-assigned on mount and double-loads.
				link.href = '/themes/' + theme + '/dist/' + theme + '.css?v=rc16';
				link.onerror = function() {
					if (link.href.indexOf('/dist/') !== -1) {
						link.href = '/themes/' + theme + '/css/' + theme + '.css?v=rc16';
					}
				};
				document.currentScript.parentNode.insertBefore(link, document.currentScript);
			})();
		</script>
		<!-- Early sidebar width loading (before body renders to prevent FOUC) -->
		<script>
			(function() {
				var savedWidth = localStorage.getItem('sidebar-width');
				if (savedWidth) {
					var width = parseInt(savedWidth, 10);
					if (width >= 180 && width <= 500) {
						document.documentElement.style.setProperty('--pc-local-sidebar-width', (width / 10) + 'rem');
					}
				}
			})();
		</script>
		<!-- Critical CSS: Page loader (inline to prevent FOUC) -->
		<style>
			.page-loader {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: var(--page-loader-bg, rgba(26, 26, 26, 0.95));
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 99999;
				transition: opacity 0.15s ease, visibility 0.15s ease;
			}
			.page-loader.loaded {
				opacity: 0;
				visibility: hidden;
			}
			.page-loader__spinner {
				width: 50px;
				height: 50px;
				border: 4px solid var(--page-loader-spinner-border, #333);
				border-top-color: var(--page-loader-spinner-accent, #0066cc);
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
		</style>
		<!-- Privacy-friendly analytics by Plausible -->
		<script async src="https://stats.keenmate.services/js/pa-e3fIuOeNjZ4Z1-h7kDDcY.js"></script>
		<script>
			window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
			plausible.init()
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Page Loader: Shows while fonts/CSS load -->
		<div class="page-loader" id="pageLoader">
			<div class="page-loader__spinner"></div>
		</div>
		<script>
			(function() {
				var loader = document.getElementById('pageLoader');
				var fontsReady = false;
				var appReady = false;

				function hideLoader() {
					if (!fontsReady || !appReady) return;
					requestAnimationFrame(function() {
						loader.classList.add('loaded');
						setTimeout(function() { loader.remove(); }, 80);
					});
				}

				// Wait for fonts
				if (document.fonts && document.fonts.ready) {
					Promise.race([
						document.fonts.ready,
						new Promise(function(resolve) { setTimeout(resolve, 1000); })
					]).then(function() {
						fontsReady = true;
						hideLoader();
					});
				} else {
					window.addEventListener('load', function() {
						fontsReady = true;
						hideLoader();
					});
				}

				// Wait for Svelte hydration — called from +layout.svelte onMount
				window.__pageLoaderReady = function() {
					appReady = true;
					hideLoader();
				};

				// Safety timeout — never block longer than 3s
				setTimeout(function() {
					fontsReady = true;
					appReady = true;
					hideLoader();
				}, 3000);
			})();
		</script>
		<!-- Prevent FOUC: Apply saved settings immediately before rendering -->
		<script>
			(function() {
				// Helper to get cookie value
				function getCookie(name) {
					var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
					return match ? match[2] : null;
				}

				// Apply container width from cookie (server-controlled)
				var containerWidth = getCookie('containerWidth') || 'fluid';
				if (containerWidth && containerWidth !== 'fluid') {
					document.body.classList.add('pa-container-' + containerWidth);
				}

				// Apply sidebar mode from cookie
				var sidebarMode = getCookie('sidebarMode');
				if (sidebarMode === 'sticky') {
					document.body.classList.add('pc-layout--sticky');
				}

				// Apply sidebar hidden state from localStorage
				var sidebarHidden = localStorage.getItem('sidebar-hidden') === 'true';
				if (sidebarHidden) {
					document.body.classList.add('sidebar-hidden');
				}

				// Apply theme mode from localStorage
				// Supports: 'light', 'dark', 'auto' (follows OS preference)
				// For themes with dark :root defaults (like Audi), explicitly apply
				// pc-mode-light to override and prevent dark flash on light mode reload.
				// With NO stored mode (first visit) apply nothing: the theme's own :root
				// default is its manifest default, which is exactly what SettingsPanel
				// will pick on mount — forcing 'light' here would flash on dark-first themes.
				var themeMode = localStorage.getItem('theme-mode');
				if (themeMode) {
					var resolvedMode;
					if (themeMode === 'auto') {
						// Check OS preference for auto mode
						resolvedMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					} else {
						resolvedMode = themeMode;
					}
					document.body.classList.add('pc-mode-' + resolvedMode);
				}

				// Apply the colour variant the same way — SettingsPanel re-applies it on
				// mount, but without this the default variant paints first and swaps.
				var colorVariant = localStorage.getItem('color-variant');
				if (colorVariant) {
					document.body.classList.add('pa-color-' + colorVariant);
				}

				// Apply font size from localStorage
				var fontSize = localStorage.getItem('font-size');
				if (fontSize && fontSize !== 'default') {
					document.documentElement.classList.add('font-size-' + fontSize);
				}

				// Apply font family from localStorage
				var fontFamily = localStorage.getItem('font-family');
				if (fontFamily && fontFamily !== 'default') {
					document.body.classList.add('font-family-' + fontFamily);
				}

				// Apply compact mode from localStorage
				var compactMode = localStorage.getItem('compact-mode') === 'true';
				if (compactMode) {
					document.body.classList.add('compact-mode');
				}

				// Apply sidebar behavior from localStorage
				var sidebarBehavior = localStorage.getItem('sidebar-behavior');
				if (sidebarBehavior === 'icon-collapse') {
					document.body.classList.add('sidebar-icon-collapse');
				}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
